[project]
name = "spacesim"
version = "0.1.0"
description = "Space robotics layer on MuJoCo 4.0 for multi-agent RL (in-orbit servicing)"
requires-python = ">=3.10"
dependencies = ["mujoco>=3.3,<5", "pettingzoo>=1.24", "gymnasium>=1.0", "numpy>=1.26", "pyyaml>=6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["spacesim*"]

[tool.setuptools.package-data]
spacesim = ["scenarios/*.yaml"]
